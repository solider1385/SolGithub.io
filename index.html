<!DOCTYPE html>
<html lang="fa">
<head>

    <title>قالب ساده HTML</title>
    <style>
        body {
            background-color: white;
            font-family: Arial, sans-serif;

            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #ddd;

</header>

<main>
    <h2>خوش آمدید!</h2>
    <p>این یک قالب ساده HTML با بک‌گراند سفید است. شما می‌توانید محتوا را به دلخواه خود تغییر دهید.</p>
</main>

<footer>
    <p>کپی رایت © 2023</p>
</footer>

</body>
</html>
