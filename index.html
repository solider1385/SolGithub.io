<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>B-Coin</title>

    <style>
        * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background-color: #0D0D0D;
    color: white;
}

.container {
    text-align: center;
    padding: 20px;
}

.header {
    position: relative;
}

.vip {
    background-color: rgba(0, 255, 255, 0.8);
    border-radius: 15px;
    padding: 5px 10px;
    display: inline-block;
    position: absolute;
    top: 10px;
    left: 10px;
}

.token-info {
    margin-top: 20px;
}

.token {
    font-size: 24px;
}

.main-content {
    margin: 40px 0;
}

.token-display {
    display: flex;
    align-items: center;
    justify-content: center;
}

.token-icon {
    margin-right: 10px;
}

.token-amount {
    font-size: 48px;
    font-weight: bold;
    margin-right: 10px;
}

.token-change {
    font-size: 24px;
    color: green;
}

.footer {
    display: flex;
    justify-content: center;
    margin-top: 20px;
}

.footer-icon {
    display: flex;
    gap: 10px;
}

.icon {
    width: 50px;
    height: 50px;
}
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>B-Coin</h1>
            <div class="vip">VIP</div>
            <div class="token-info">
                <span class="token">3962</span>
            </div>
        </header>
        <main class="main-content">
            <h2>Your Token:</h2>
            <div class="token-display">
                <img src="https://via.placeholder.com/100" alt="Token" class="token-icon">
                <span class="token-amount">10748</span>
                <span class="token-change">+41804</span>
            </div>
        </main>
        <footer class="footer">
            <div class="footer-icon">
                <img src="https://via.placeholder.com/50" alt="Footer Icon" class="icon">
                <img src="https://via.placeholder.com/50" alt="Footer Icon" class="icon">
                <img src="https://via.placeholder.com/50" alt="Footer Icon" class="icon">
                <img src="https://via.placeholder.com/50" alt="Footer Icon" class="icon">
            </div>
        </footer>
    </div>
</body>
</html>
